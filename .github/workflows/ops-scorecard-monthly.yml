name: "Ops: monthly scorecard"

# OPS-P0-004 / OPS-P4-002 / OPS-P5 — Re-evaluate docs/ops scorecard, commit to
# main via Studio GitHub App, email ACS digest (ALERT-EMAIL + SITE-CONTACT-EMAIL)
# with scores + subscription spend/MoM + site performance. On job failure, email
# ALERT-EMAIL only (not SITE-CONTACT-EMAIL). Never writes emails, phones, App
# private keys, GA SA JSON, or other secrets into the scorecard or logs.
# Scorecard-only pushes are excluded from azure-static-web-apps.yml (paths-ignore).
# Display names follow docs/runbooks/github-actions-naming.md (Scheme A).

on:
  schedule:
    # 1st of month 14:00 UTC
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-scorecard-monthly
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh scorecard
    runs-on: ubuntu-latest
    # Required for TF OIDC (bootstrap trusts environment:prod|staging|pull_request only).
    environment: prod
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Never persist GITHUB_TOKEN into git — that pushes as github-actions[bot].
          persist-credentials: false

      - name: Azure login (SLI probe + GitHub App + digest secrets)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TF_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_TF_SUBSCRIPTION_ID }}

      - name: Mint Studio GitHub App installation token
        id: app-token
        env:
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          set +x
          chmod +x scripts/mint-github-app-token.sh
          ./scripts/mint-github-app-token.sh

      - name: Verify App installation token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          set +x
          # Do NOT use GET /repos permissions.push — installation tokens often
          # report all-false there even when Contents:write is granted.
          if [[ "${{ steps.app-token.outputs.contents_permission }}" != "write" ]]; then
            echo "::error::Expected contents=write on installation token."
            exit 1
          fi
          repos="$(gh api installation/repositories --jq '.repositories[].full_name')"
          echo "Installation can access:"
          printf '%s\n' "$repos"
          printf '%s\n' "$repos" | grep -qx "${GITHUB_REPOSITORY}"
          echo "Confirmed App installation ${{ steps.app-token.outputs.installation_id }} (app ${{ steps.app-token.outputs.app_id }}) has Contents:write on ${GITHUB_REPOSITORY}."

      - name: Configure git for Studio App push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          set +x
          app_id="${{ steps.app-token.outputs.app_id }}"
          git config user.name "elyse-portfolio-studio[bot]"
          git config user.email "${app_id}+elyse-portfolio-studio[bot]@users.noreply.github.com"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local --unset-all http.https://github.com/.extraheader || true
          basic="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${basic}"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${basic}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch GA Data API secrets
        env:
          AZURE_SHARED_KEY_VAULT_NAME: ${{ vars.AZURE_SHARED_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          set +x
          chmod +x scripts/fetch-ga-scorecard-secrets.sh
          ./scripts/fetch-ga-scorecard-secrets.sh

      - name: Refresh scorecard
        run: node scripts/ops-scorecard-refresh.mjs --monthly --azure

      - name: Commit scorecard to main
        run: |
          set -euo pipefail
          set +x

          if git diff --quiet -- docs/ops/operational-excellence-scorecard.md docs/ops/scorecard-evaluation.json; then
            echo "No scorecard changes; skipping commit."
          else
            stamp="$(date -u +%Y-%m)"
            git add docs/ops/operational-excellence-scorecard.md docs/ops/scorecard-evaluation.json
            git commit -m "OPS: monthly operational excellence scorecard (${stamp})"
            # Rebase onto latest main before push — the refresh probe window can
            # race with concurrent merges (non-fast-forward without this).
            chmod +x scripts/git-push-main-rebase.sh
            ./scripts/git-push-main-rebase.sh --message "scorecard ${stamp}"
            echo "Pushed scorecard refresh to main as elyse-portfolio-studio[bot] (${stamp})."
          fi

      - name: Cleanup GA service-account temp file
        if: always()
        run: |
          set -euo pipefail
          set +x
          if [[ -n "${GA_DATA_API_SA_JSON_FILE:-}" && -f "${GA_DATA_API_SA_JSON_FILE}" ]]; then
            rm -f "${GA_DATA_API_SA_JSON_FILE}"
            echo "Removed GA Data API temp credentials file."
          fi

      - name: Fetch ACS digest secrets
        env:
          AZURE_SHARED_KEY_VAULT_NAME: ${{ vars.AZURE_SHARED_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          set +x
          chmod +x scripts/fetch-ops-digest-secrets.sh
          ./scripts/fetch-ops-digest-secrets.sh

      - name: Email scorecard digest
        env:
          SCORECARD_REPO_URL: https://github.com/${{ github.repository }}
        run: node scripts/ops-scorecard-email.mjs

  notify_failure:
    name: Notify scorecard workflow failure
    needs: [refresh]
    if: always() && !cancelled() && needs.refresh.result == 'failure'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Azure login (digest secrets)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TF_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_TF_SUBSCRIPTION_ID }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch ACS digest secrets
        env:
          AZURE_SHARED_KEY_VAULT_NAME: ${{ vars.AZURE_SHARED_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          set +x
          chmod +x scripts/fetch-ops-digest-secrets.sh
          ./scripts/fetch-ops-digest-secrets.sh

      - name: Email ALERT-EMAIL failure notice
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: "Ops: monthly scorecard"
        run: node scripts/ops-scorecard-failure-email.mjs
