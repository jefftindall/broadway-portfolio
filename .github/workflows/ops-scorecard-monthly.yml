name: OPS monthly scorecard

# OPS-P0-004 — Re-evaluate docs/ops/operational-excellence-scorecard.md and open a PR.
# Never writes alert emails, phones, or secrets into the scorecard or logs.

on:
  schedule:
    # 1st of month 14:00 UTC
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ops-scorecard-monthly
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh scorecard
    runs-on: ubuntu-latest
    # Required for TF OIDC (bootstrap trusts environment:prod|staging|pull_request only).
    environment: prod
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Azure login (optional SLI probe)
        id: azure_login
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TF_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_TF_SUBSCRIPTION_ID }}

      - name: Refresh scorecard
        run: |
          if [ "${{ steps.azure_login.outcome }}" = "success" ]; then
            node scripts/ops-scorecard-refresh.mjs --monthly --azure
          else
            echo "Azure login skipped/failed — refreshing qualitative dimensions only."
            node scripts/ops-scorecard-refresh.mjs --monthly
          fi

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- docs/ops/operational-excellence-scorecard.md docs/ops/scorecard-evaluation.json; then
            echo "No scorecard changes; skipping PR."
            exit 0
          fi

          stamp="$(date -u +%Y-%m)"
          branch="ops/scorecard-${stamp}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git stash push -u -m "ops-scorecard" -- docs/ops/operational-excellence-scorecard.md docs/ops/scorecard-evaluation.json

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch"
          fi

          git stash pop

          git add docs/ops/operational-excellence-scorecard.md docs/ops/scorecard-evaluation.json
          if git diff --cached --quiet; then
            echo "No staged scorecard changes after branch sync; skipping PR."
            exit 0
          fi

          git commit -m "OPS: monthly operational excellence scorecard (${stamp})"
          git push -u origin HEAD

          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updated existing PR #${existing}"
            exit 0
          fi

          gh pr create \
            --title "OPS: monthly operational excellence scorecard" \
            --body "## Summary

          - Monthly refresh of \`docs/ops/operational-excellence-scorecard.md\` (\`OPS-P0-004\`)
          - Qualitative dimensions restamped; optional prod homepage/materials/FCP SLIs when Azure OIDC succeeds
          - No alert emails, phones, or secrets in this PR

          ## Test plan

          - [ ] Confirm scorecard has **Last reviewed** updated and no private contacts
          - [ ] Spot-check dimension scores / gaps against reality
          - [ ] Merge only after human review (do not auto-merge)
          "
