name: Sync SWA API secrets

# Copy resolved Key Vault values into SWA app settings for managed Functions.
# Manual only — run after rotating GEMINI / GitHub App / ALLOWED-USER-IDS.
# AAD_CLIENT_SECRET stays a Key Vault reference (auth platform resolves it).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to sync
        required: true
        type: choice
        options:
          - staging
          - prod
        default: staging

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    name: Sync ${{ inputs.environment }} SWA API secrets
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sync secrets from Key Vault
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          chmod +x scripts/sync-swa-api-secrets.sh
          ./scripts/sync-swa-api-secrets.sh "${{ inputs.environment }}"
