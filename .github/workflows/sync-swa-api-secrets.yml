name: Sync SWA API secrets

# Copy resolved Key Vault values into SWA app settings for managed Functions.
# Manual only — run after rotating GEMINI / GitHub App / ALLOWED-USER-IDS.
# AAD_CLIENT_SECRET stays a Key Vault reference (auth platform resolves it).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sync_staging:
    name: Sync staging SWA API secrets
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sync secrets from Key Vault
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          chmod +x scripts/sync-swa-api-secrets.sh
          ./scripts/sync-swa-api-secrets.sh staging

  sync_prod:
    name: Sync prod SWA API secrets
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sync secrets from Key Vault
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          chmod +x scripts/sync-swa-api-secrets.sh
          ./scripts/sync-swa-api-secrets.sh prod
