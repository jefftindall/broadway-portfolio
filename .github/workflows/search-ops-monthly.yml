name: "Search: monthly signals"

# SEARCH-P4-002 — Monthly (1st) extract of GSC queries/CTR + GA organic
# landings since the last run into docs/ops/search-signals/{from}_{to}.{json,md}
# (+ latest.*). Also runs DISC-P4-007 casting-language discovery (catalog fit +
# allowlisted public RSS; zero Gemini) into docs/ops/casting-language/.
# Commits via Studio GitHub App. On job failure, email ALERT-EMAIL only
# (not SITE-CONTACT-EMAIL). Artifact-only pushes are paths-ignored in
# azure-static-web-apps.yml.
# Display names follow docs/runbooks/github-actions-naming.md (Scheme A).

on:
  schedule:
    # 1st of month at 13:00 UTC (before OPS scorecard at 14:00 so a future
    # digest can include fresh search-signal details)
    - cron: "0 13 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: search-ops-monthly
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh search signals
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Azure login (GSC/GA secrets + GitHub App)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TF_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_TF_SUBSCRIPTION_ID }}

      - name: Mint Studio GitHub App installation token
        id: app-token
        env:
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          set +x
          chmod +x scripts/mint-github-app-token.sh
          ./scripts/mint-github-app-token.sh

      - name: Verify App installation token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          set +x
          if [[ "${{ steps.app-token.outputs.contents_permission }}" != "write" ]]; then
            echo "::error::Expected contents=write on installation token."
            exit 1
          fi
          repos="$(gh api installation/repositories --jq '.repositories[].full_name')"
          echo "Installation can access:"
          printf '%s\n' "$repos"
          printf '%s\n' "$repos" | grep -qx "${GITHUB_REPOSITORY}"
          echo "Confirmed App installation ${{ steps.app-token.outputs.installation_id }} (app ${{ steps.app-token.outputs.app_id }}) has Contents:write on ${GITHUB_REPOSITORY}."

      - name: Configure git for Studio App push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          set +x
          app_id="${{ steps.app-token.outputs.app_id }}"
          git config user.name "elyse-portfolio-studio[bot]"
          git config user.email "${app_id}+elyse-portfolio-studio[bot]@users.noreply.github.com"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local --unset-all http.https://github.com/.extraheader || true
          basic="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${basic}"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${basic}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch GA Data API secrets
        env:
          AZURE_SHARED_KEY_VAULT_NAME: ${{ vars.AZURE_SHARED_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          set +x
          chmod +x scripts/fetch-ga-scorecard-secrets.sh
          ./scripts/fetch-ga-scorecard-secrets.sh

      - name: Fetch GSC Search Analytics secrets
        env:
          AZURE_SHARED_KEY_VAULT_NAME: ${{ vars.AZURE_SHARED_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          set +x
          chmod +x scripts/fetch-gsc-search-secrets.sh
          ./scripts/fetch-gsc-search-secrets.sh

      - name: Refresh search signal artifact
        run: node scripts/search-ops-signals-refresh.mjs

      - name: Refresh casting-language candidates
        run: |
          set -euo pipefail
          # DISC-P4-007 — catalog fit/dedupe + allowlisted public RSS (no Gemini,
          # no board scrapes). Per-source RSS failures are soft; catalog still ranks.
          node scripts/casting-language-discover.mjs --fetch-news

      - name: Commit search + casting-language artifacts to main
        run: |
          set -euo pipefail
          set +x

          # Use porcelain status (not git diff): first runs create untracked
          # latest.* / dated files that git diff ignores, which skipped commits.
          signals_dirty="$(git status --porcelain -- docs/ops/search-signals/ || true)"
          casting_dirty="$(git status --porcelain -- docs/ops/casting-language/ || true)"
          if [[ -z "${signals_dirty}" && -z "${casting_dirty}" ]]; then
            echo "No search-signal or casting-language changes; skipping commit."
          else
            stamp="$(date -u +%Y-%m-%d)"
            parts=()
            if [[ -n "${signals_dirty}" ]]; then
              git add docs/ops/search-signals/
              parts+=("search signals")
            fi
            if [[ -n "${casting_dirty}" ]]; then
              git add docs/ops/casting-language/
              parts+=("casting language")
            fi
            joined="$(IFS=' + '; echo "${parts[*]}")"
            git commit -m "SEARCH: monthly ${joined} (${stamp})"
            # Rebase onto latest main before push — long GSC/GA probes can race
            # with concurrent merges (non-fast-forward without this).
            chmod +x scripts/git-push-main-rebase.sh
            ./scripts/git-push-main-rebase.sh --message "monthly search ops ${stamp}"
            echo "Pushed monthly search-ops artifacts to main as elyse-portfolio-studio[bot] (${stamp})."
          fi

      - name: Cleanup GSC/GA service-account temp files
        if: always()
        run: |
          set -euo pipefail
          set +x
          if [[ -n "${GSC_DATA_API_SA_JSON_FILE:-}" && -f "${GSC_DATA_API_SA_JSON_FILE}" ]]; then
            rm -f "${GSC_DATA_API_SA_JSON_FILE}"
            echo "Removed GSC Search Analytics temp credentials file."
          fi
          if [[ -n "${GA_DATA_API_SA_JSON_FILE:-}" && -f "${GA_DATA_API_SA_JSON_FILE}" ]]; then
            rm -f "${GA_DATA_API_SA_JSON_FILE}"
            echo "Removed GA Data API temp credentials file."
          fi

  notify_failure:
    name: Notify monthly search-ops failure
    needs: [refresh]
    if: always() && !cancelled() && needs.refresh.result == 'failure'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Azure login (digest secrets)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TF_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_TF_SUBSCRIPTION_ID }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch ACS digest secrets
        env:
          AZURE_SHARED_KEY_VAULT_NAME: ${{ vars.AZURE_SHARED_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          set +x
          chmod +x scripts/fetch-ops-digest-secrets.sh
          ./scripts/fetch-ops-digest-secrets.sh

      - name: Email ALERT-EMAIL failure notice
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: "Search: monthly signals"
        run: node scripts/ops-scorecard-failure-email.mjs
