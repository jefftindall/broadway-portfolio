name: "CD: staging"

# Manual async test: apply staging Terraform + deploy the staging app from any branch.
# Runs Playwright smoke against staging afterward (does not promote to prod).
# Automated deploys run only on merge to main (azure-static-web-apps.yml / CD: main).
# Shares concurrency group portfolio-cd with azure-static-web-apps.yml so manual
# staging deploys cannot overlap main CD.
# Display names follow docs/runbooks/github-actions-naming.md (Scheme A).
on:
  workflow_dispatch:
    inputs:
      prod_smoke_only:
        description: Run production smoke only (skip staging deploy)
        type: boolean
        default: false

concurrency:
  group: portfolio-cd
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write
  actions: write

jobs:
  terraform_staging:
    name: Terraform Apply Staging
    if: github.event.inputs.prod_smoke_only != 'true'
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: infra/environments/staging
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API deps (Stripe Payment Link upsert)
        working-directory: ${{ github.workspace }}
        run: npm ci --prefix api

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Azure login (Terraform OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TF_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_TF_SUBSCRIPTION_ID }}

      - name: Require TF_GITHUB_TOKEN
        env:
          TF_GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: |
          if [ -z "$TF_GITHUB_TOKEN" ]; then
            echo "::error::Add repository secret TF_GITHUB_TOKEN (a PAT that can read/write Actions environment variables). The default GITHUB_TOKEN cannot manage environment variables."
            exit 1
          fi

      - name: Terraform init
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform init -input=false

      - name: Terraform plan
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          TF_VAR_contact_ciam_azuread_use_oidc: "true"
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          TF_VAR_contact_ciam_azuread_use_oidc: "true"
        run: terraform apply -input=false tfplan

      - name: Sync SWA API secrets
        working-directory: ${{ github.workspace }}
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_TF_SUBSCRIPTION_ID }}
        run: bash scripts/sync-swa-api-secrets.sh staging

  deploy_staging:
    name: Deploy Staging
    needs: terraform_staging
    if: github.event.inputs.prod_smoke_only != 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      PUBLIC_APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
      PUBLIC_APPINSIGHTS_SAMPLE_PERCENT: "25"
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Azure login (OIDC)
        env:
          AZURE_LOGIN_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_LOGIN_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_LOGIN_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: bash scripts/azure-oidc-login.sh

      - name: Fetch site contact secrets from Key Vault
        env:
          AZURE_SHARED_KEY_VAULT_NAME: ${{ vars.AZURE_SHARED_KEY_VAULT_NAME }}
        run: |
          chmod +x scripts/fetch-site-contact-secrets.sh
          ./scripts/fetch-site-contact-secrets.sh

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Seed Studio People
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
        run: bash scripts/seed-studio-people.sh staging

      - name: Apply staging noindex (robots.txt + X-Robots-Tag)
        run: node scripts/apply-staging-noindex.mjs dist

      - name: Patch contact auth in dist
        env:
          AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          node scripts/patch-contact-auth-config.mjs dist --from-swa
          ENABLED=$(az staticwebapp appsettings list \
            --name "$AZURE_STATIC_WEB_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.CONTACT_ACCOUNTS_ENABLED" -o tsv)
          if [[ "$ENABLED" == "true" ]]; then
            node scripts/sync-contact-oidc-issuer.mjs dist
          fi

      - name: Resolve Static Web Apps deploy token
        id: swa
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_STATIC_WEB_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "api_key=$TOKEN" >> "$GITHUB_OUTPUT"

      # Always pass api_location. Omitting it (or "") is how SWA unlinks
      # managed Functions — do not skip the API on content-only deploys.
      - name: Emit DeployStarted to App Insights
        continue-on-error: true
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
          DEPLOY_ENVIRONMENT: staging
          GIT_SHA: ${{ github.sha }}
          JOB_NAME: "CD: staging"
        run: bash scripts/emit-appinsights-event.sh DeployStarted

      - name: Deploy to staging
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.api_key }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          api_location: "api"
          skip_app_build: true

      - name: Emit DeployCompleted to App Insights
        continue-on-error: true
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
          DEPLOY_ENVIRONMENT: staging
          GIT_SHA: ${{ github.sha }}
          JOB_NAME: "CD: staging"
        run: bash scripts/emit-appinsights-event.sh DeployCompleted

  smoke_staging:
    name: Smoke Staging
    needs: [deploy_staging]
    if: github.event.inputs.prod_smoke_only != 'true' && needs.deploy_staging.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Azure login (OIDC)
        env:
          AZURE_LOGIN_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_LOGIN_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_LOGIN_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: bash scripts/azure-oidc-login.sh

      - name: Resolve staging hostname
        id: host
        run: |
          chmod +x scripts/resolve-swa-hostname.sh
          HOST=$(./scripts/resolve-swa-hostname.sh \
            "${{ vars.AZURE_STATIC_WEB_APP_NAME }}" \
            "${{ vars.AZURE_RESOURCE_GROUP }}")
          echo "hostname=$HOST" >> "$GITHUB_OUTPUT"
          echo "Staging URL: https://$HOST"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch Studio auth secrets
        env:
          AZURE_SHARED_KEY_VAULT_NAME: ${{ vars.AZURE_SHARED_KEY_VAULT_NAME }}
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
          AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AAD_CLIENT_ID: ${{ vars.AAD_CLIENT_ID }}
          AAD_MONITOR_TOKEN_SCOPE: ${{ vars.AAD_MONITOR_TOKEN_SCOPE }}
          DEPLOY_ENVIRONMENT: staging
        run: |
          chmod +x scripts/fetch-studio-auth-secrets.sh
          ./scripts/fetch-studio-auth-secrets.sh

      - name: SWA client_credentials check
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: npm run test:studio-auth-token

      - name: Run staging smoke (desktop + mobile)
        env:
          BASE_URL: https://${{ steps.host.outputs.hostname }}
          CI: true
        run: npm run test:smoke

      - name: Upload smoke traces (failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-staging-branch-playwright
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Lab FCP soft gate (OPS-P2-003)
        continue-on-error: true
        env:
          BASE_URL: https://${{ steps.host.outputs.hostname }}
          LAB_FCP_RUNS: "3"
        run: npm run test:lab-fcp

      - name: Run staging journeys (desktop + mobile subset)
        env:
          BASE_URL: https://${{ steps.host.outputs.hostname }}
          CI: true
        run: npm run test:journey

  smoke_prod_verify:
    name: Smoke Production
    if: github.event.inputs.prod_smoke_only == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Azure login (OIDC)
        env:
          AZURE_LOGIN_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_LOGIN_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_LOGIN_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: bash scripts/azure-oidc-login.sh

      - name: Resolve production hostname
        id: host
        run: |
          SWA_NAME="${{ vars.AZURE_STATIC_WEB_APP_NAME }}"
          SWA_RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          DEFAULT=$(az staticwebapp show \
            --name "$SWA_NAME" \
            --resource-group "$SWA_RG" \
            --query defaultHostname -o tsv)
          CUSTOM=$(az staticwebapp hostname list \
            --name "$SWA_NAME" \
            --resource-group "$SWA_RG" \
            -o json | jq -r '
              def domain: .domainName // .name // .properties.domainName // empty;
              def ready_status: .status // .properties.status // empty;
              def is_default: (.isDefault // .properties.isDefault // false) == true;
              [ .[] | select(ready_status == "Ready") ] as $ready
              | ($ready | map(select(is_default)) | .[0])
                // ($ready | map(select((domain | ascii_downcase | startswith("www.") | not))) | .[0])
                // $ready[0]
                // empty
              | if . == null then empty else domain end
            ')
          if [ "$CUSTOM" = "null" ] || [ "$CUSTOM" = "None" ]; then
            CUSTOM=
          fi
          HOST=${CUSTOM:-$DEFAULT}
          if [ -z "$HOST" ]; then
            echo "::error::Could not resolve production Static Web App hostname"
            exit 1
          fi
          echo "hostname=$HOST" >> "$GITHUB_OUTPUT"
          echo "Production URL: https://$HOST (defaultHostname=$DEFAULT)"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch Studio auth secrets
        env:
          AZURE_SHARED_KEY_VAULT_NAME: ${{ vars.AZURE_SHARED_KEY_VAULT_NAME }}
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
          AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AAD_CLIENT_ID: ${{ vars.AAD_CLIENT_ID }}
          AAD_MONITOR_TOKEN_SCOPE: ${{ vars.AAD_MONITOR_TOKEN_SCOPE }}
          DEPLOY_ENVIRONMENT: prod
        run: |
          chmod +x scripts/fetch-studio-auth-secrets.sh
          ./scripts/fetch-studio-auth-secrets.sh

      - name: SWA client_credentials check
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: npm run test:studio-auth-token

      - name: Run production smoke (desktop + mobile)
        env:
          BASE_URL: https://${{ steps.host.outputs.hostname }}
          CI: true
        run: npm run test:smoke

      - name: Upload smoke traces (failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-prod-verify-playwright
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
