name: Staging branch

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write
  actions: write

jobs:
  terraform_staging:
    name: Terraform Apply Staging
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: infra/environments/staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure login (Terraform OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TF_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_TF_SUBSCRIPTION_ID }}

      - name: Terraform init
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: terraform init -input=false

      - name: Terraform plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: terraform apply -input=false tfplan

  deploy_staging:
    name: Deploy Staging
    needs: terraform_staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      PUBLIC_APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
      PUBLIC_APPINSIGHTS_SAMPLE_PERCENT: "25"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Static Web Apps deploy token
        id: swa
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_STATIC_WEB_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "api_key=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.api_key }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          api_location: "api"
          skip_app_build: true

      - name: Emit DeployCompleted to App Insights
        continue-on-error: true
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
          DEPLOY_ENVIRONMENT: staging
          GIT_SHA: ${{ github.sha }}
          JOB_NAME: Staging branch
        run: |
          if [ -z "$APPINSIGHTS_CONNECTION_STRING" ]; then
            echo "No App Insights connection string; skipping."
            exit 0
          fi
          IKEY=$(echo "$APPINSIGHTS_CONNECTION_STRING" | sed -n 's/.*InstrumentationKey=\([^;]*\).*/\1/p')
          ENDPOINT=$(echo "$APPINSIGHTS_CONNECTION_STRING" | sed -n 's/.*IngestionEndpoint=\([^;]*\).*/\1/p')
          ENDPOINT=${ENDPOINT:-https://dc.services.visualstudio.com}
          ENDPOINT=${ENDPOINT%/}
          TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          curl -sS -X POST "${ENDPOINT}/v2/track" \
            -H "Content-Type: application/json" \
            -d "[{
              \"name\": \"Microsoft.ApplicationInsights.Event\",
              \"time\": \"${TIME}\",
              \"iKey\": \"${IKEY}\",
              \"data\": {
                \"baseType\": \"EventData\",
                \"baseData\": {
                  \"ver\": 2,
                  \"name\": \"DeployCompleted\",
                  \"properties\": {
                    \"environment\": \"${DEPLOY_ENVIRONMENT}\",
                    \"sha\": \"${GIT_SHA}\",
                    \"job\": \"${JOB_NAME}\"
                  }
                }
              }
            }]"
