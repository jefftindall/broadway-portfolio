name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # Always deploy staging first (PRs and main). Prod only runs after this succeeds on main.
  deploy_staging:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Deploy Staging
    environment: staging
    env:
      PUBLIC_APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
      PUBLIC_APPINSIGHTS_SAMPLE_PERCENT: "25"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Static Web Apps deploy token
        id: swa
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_STATIC_WEB_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "api_key=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.api_key }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # With skip_app_build, app_location must be the prebuilt output folder.
          app_location: "dist"
          api_location: "api"
          skip_app_build: true

      - name: Emit DeployCompleted to App Insights
        continue-on-error: true
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
          DEPLOY_ENVIRONMENT: staging
          GIT_SHA: ${{ github.sha }}
          JOB_NAME: Deploy Staging
        run: |
          if [ -z "$APPINSIGHTS_CONNECTION_STRING" ]; then
            echo "No App Insights connection string; skipping."
            exit 0
          fi
          IKEY=$(echo "$APPINSIGHTS_CONNECTION_STRING" | sed -n 's/.*InstrumentationKey=\([^;]*\).*/\1/p')
          ENDPOINT=$(echo "$APPINSIGHTS_CONNECTION_STRING" | sed -n 's/.*IngestionEndpoint=\([^;]*\).*/\1/p')
          ENDPOINT=${ENDPOINT:-https://dc.services.visualstudio.com}
          ENDPOINT=${ENDPOINT%/}
          TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          curl -sS -X POST "${ENDPOINT}/v2/track" \
            -H "Content-Type: application/json" \
            -d "[{
              \"name\": \"Microsoft.ApplicationInsights.Event\",
              \"time\": \"${TIME}\",
              \"iKey\": \"${IKEY}\",
              \"data\": {
                \"baseType\": \"EventData\",
                \"baseData\": {
                  \"ver\": 2,
                  \"name\": \"DeployCompleted\",
                  \"properties\": {
                    \"environment\": \"${DEPLOY_ENVIRONMENT}\",
                    \"sha\": \"${GIT_SHA}\",
                    \"job\": \"${JOB_NAME}\"
                  }
                }
              }
            }]"

  deploy_prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy_staging
    runs-on: ubuntu-latest
    name: Deploy Production
    environment: prod
    env:
      PUBLIC_APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
      PUBLIC_APPINSIGHTS_SAMPLE_PERCENT: "10"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Static Web Apps deploy token
        id: swa
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_STATIC_WEB_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "api_key=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.api_key }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          api_location: "api"
          skip_app_build: true

      - name: Emit DeployCompleted to App Insights
        continue-on-error: true
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
          DEPLOY_ENVIRONMENT: prod
          GIT_SHA: ${{ github.sha }}
          JOB_NAME: Deploy Production
        run: |
          if [ -z "$APPINSIGHTS_CONNECTION_STRING" ]; then
            echo "No App Insights connection string; skipping."
            exit 0
          fi
          IKEY=$(echo "$APPINSIGHTS_CONNECTION_STRING" | sed -n 's/.*InstrumentationKey=\([^;]*\).*/\1/p')
          ENDPOINT=$(echo "$APPINSIGHTS_CONNECTION_STRING" | sed -n 's/.*IngestionEndpoint=\([^;]*\).*/\1/p')
          ENDPOINT=${ENDPOINT:-https://dc.services.visualstudio.com}
          ENDPOINT=${ENDPOINT%/}
          TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          curl -sS -X POST "${ENDPOINT}/v2/track" \
            -H "Content-Type: application/json" \
            -d "[{
              \"name\": \"Microsoft.ApplicationInsights.Event\",
              \"time\": \"${TIME}\",
              \"iKey\": \"${IKEY}\",
              \"data\": {
                \"baseType\": \"EventData\",
                \"baseData\": {
                  \"ver\": 2,
                  \"name\": \"DeployCompleted\",
                  \"properties\": {
                    \"environment\": \"${DEPLOY_ENVIRONMENT}\",
                    \"sha\": \"${GIT_SHA}\",
                    \"job\": \"${JOB_NAME}\"
                  }
                }
              }
            }]"
