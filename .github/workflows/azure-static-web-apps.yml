name: Azure Static Web Apps CI/CD

# Deploy only on merge to main when app or infra paths change. PRs run static analysis only.
# Scorecard-only pushes (docs/ops scorecard artifacts) are paths-ignored so the monthly
# OPS refresh can commit to main without starting CD.
# Manual full CD from main: Actions → Azure Static Web Apps CI/CD (workflow_dispatch).
# Manual dispatch from other branches runs staging only; prod stages are skipped.
# Manual staging-only test: Actions → Staging branch (workflow_dispatch).
# After Deploy Staging: Smoke Staging (Playwright desktop + mobile) must pass before prod.
# After Deploy Production: Smoke Production re-runs the same suite against prod; failure → Sev1
# (SmokeFailed → ag-elyse-critical-prod: email + SMS + voice). No auto-rollback (TEST-D-003).
# Build once per release; staging and prod deploy the same artifact that was verified.
# Serialize CD with staging-branch.yml (shared group) so only one deploy runs at a time.
# cancel-in-progress: false waits instead of cancelling; GitHub keeps one pending slot
# (latest-wins if more runs arrive while one is queued).
on:
  push:
    branches:
      - main
    # Monthly scorecard commits (Studio GitHub App → main) must not start CD.
    paths-ignore:
      - "docs/ops/operational-excellence-scorecard.md"
      - "docs/ops/scorecard-evaluation.json"
  workflow_dispatch:

concurrency:
  group: portfolio-cd
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.outputs.outputs.infra }}
      release: ${{ steps.outputs.outputs.release }}
      prod: ${{ steps.outputs.outputs.prod }}
      test_profile: ${{ steps.outputs.outputs.test_profile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
              - '.github/workflows/azure-static-web-apps.yml'
              - '.github/workflows/static-analysis.yml'
              - '.github/workflows/staging-branch.yml'
            app:
              - 'src/**'
              - 'public/**'
              - 'api/**'
              - 'package.json'
              - 'package-lock.json'
              - 'astro.config.mjs'
              - 'staticwebapp.config.json'
              - 'tsconfig.json'
              - 'scripts/generate-resume-pdf.mjs'
              - 'scripts/fetch-site-contact-secrets.sh'
              - '.azure/**'
            content:
              - 'src/content/**'
              - 'public/**'
              - '!public/staticwebapp.config.json'
            site_code:
              - 'src/**'
              - '!src/content/**'
            api:
              - 'api/**'
            lessons_content:
              - 'src/content/pages/lessons.md'
              - 'src/content/pages/lessons-book.md'
      - id: outputs
        run: |
          ON_MAIN=false
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ON_MAIN=true
          fi

          INFRA="${{ steps.filter.outputs.infra }}"
          APP="${{ steps.filter.outputs.app }}"
          CONTENT="${{ steps.filter.outputs.content }}"
          SITE_CODE="${{ steps.filter.outputs.site_code }}"
          API="${{ steps.filter.outputs.api }}"
          LESSONS="${{ steps.filter.outputs.lessons_content }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "test_profile=full" >> "$GITHUB_OUTPUT"
            if [ "$ON_MAIN" = "true" ]; then
              echo "prod=true" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch on main — running full CD pipeline."
            else
              echo "prod=false" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch not on main — production stages skipped."
            fi
            exit 0
          fi

          if [ "$INFRA" = "true" ] || [ "$APP" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "prod=false" >> "$GITHUB_OUTPUT"
            echo "No app or infra changes — skipping CD jobs."
          fi
          echo "infra=$INFRA" >> "$GITHUB_OUTPUT"

          # Test profile: smoke (API-only), content (markdown/assets), or full (UI/infra/lessons).
          if [ "$INFRA" = "true" ] || [ "$SITE_CODE" = "true" ] || [ "$LESSONS" = "true" ]; then
            TEST_PROFILE=full
          elif [ "$API" = "true" ] && [ "$CONTENT" != "true" ] && [ "$SITE_CODE" != "true" ]; then
            TEST_PROFILE=smoke
          elif [ "$CONTENT" = "true" ] && [ "$SITE_CODE" != "true" ] && [ "$API" != "true" ] && [ "$INFRA" != "true" ]; then
            TEST_PROFILE=content
          else
            TEST_PROFILE=full
          fi
          echo "test_profile=$TEST_PROFILE" >> "$GITHUB_OUTPUT"
          echo "Verification profile: $TEST_PROFILE"

  terraform_staging:
    name: Terraform Apply Staging
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: infra/environments/staging
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Azure login (Terraform OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TF_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_TF_SUBSCRIPTION_ID }}

      - name: Require TF_GITHUB_TOKEN
        env:
          TF_GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: |
          if [ -z "$TF_GITHUB_TOKEN" ]; then
            echo "::error::Add repository secret TF_GITHUB_TOKEN (a PAT that can read/write Actions environment variables). The default GITHUB_TOKEN cannot manage environment variables."
            exit 1
          fi

      - name: Terraform init
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform init -input=false

      - name: Terraform plan
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform apply -input=false tfplan

  build_release:
    name: Build release
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: prod
    env:
      PUBLIC_APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
      PUBLIC_APPINSIGHTS_SAMPLE_PERCENT: "10"
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch site contact secrets from Key Vault
        env:
          AZURE_SHARED_KEY_VAULT_NAME: ${{ vars.AZURE_SHARED_KEY_VAULT_NAME }}
        run: |
          chmod +x scripts/fetch-site-contact-secrets.sh
          ./scripts/fetch-site-contact-secrets.sh

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: |
            dist
            api
          retention-days: 1
          if-no-files-found: error

  deploy_staging:
    name: Deploy Staging
    needs: [changes, terraform_staging, build_release]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.release == 'true' &&
      needs.build_release.result == 'success' &&
      (needs.terraform_staging.result == 'success' || needs.terraform_staging.result == 'skipped')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Static Web Apps deploy token
        id: swa
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_STATIC_WEB_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "api_key=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.api_key }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          api_location: "api"
          skip_app_build: true

      - name: Emit DeployCompleted to App Insights
        continue-on-error: true
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
          DEPLOY_ENVIRONMENT: staging
          GIT_SHA: ${{ github.sha }}
          JOB_NAME: Deploy Staging
        run: |
          if [ -z "$APPINSIGHTS_CONNECTION_STRING" ]; then
            echo "No App Insights connection string; skipping."
            exit 0
          fi
          IKEY=$(echo "$APPINSIGHTS_CONNECTION_STRING" | sed -n 's/.*InstrumentationKey=\([^;]*\).*/\1/p')
          ENDPOINT=$(echo "$APPINSIGHTS_CONNECTION_STRING" | sed -n 's/.*IngestionEndpoint=\([^;]*\).*/\1/p')
          ENDPOINT=${ENDPOINT:-https://dc.services.visualstudio.com}
          ENDPOINT=${ENDPOINT%/}
          TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          curl -sS -X POST "${ENDPOINT}/v2/track" \
            -H "Content-Type: application/json" \
            -d "[{
              \"name\": \"Microsoft.ApplicationInsights.Event\",
              \"time\": \"${TIME}\",
              \"iKey\": \"${IKEY}\",
              \"data\": {
                \"baseType\": \"EventData\",
                \"baseData\": {
                  \"ver\": 2,
                  \"name\": \"DeployCompleted\",
                  \"properties\": {
                    \"environment\": \"${DEPLOY_ENVIRONMENT}\",
                    \"sha\": \"${GIT_SHA}\",
                    \"job\": \"${JOB_NAME}\"
                  }
                }
              }
            }]"

  smoke_staging:
    name: Smoke Staging
    needs: [changes, deploy_staging]
    # always(): deploy_staging can succeed while terraform_staging is skipped; without
    # always(), GitHub skips this job (and prod) for the whole dependency chain.
    if: |
      always() &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.deploy_staging.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve staging hostname
        id: host
        run: |
          HOST=$(az staticwebapp show \
            --name "${{ vars.AZURE_STATIC_WEB_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query defaultHostname -o tsv)
          if [ -z "$HOST" ]; then
            echo "::error::Could not resolve staging Static Web App hostname"
            exit 1
          fi
          echo "hostname=$HOST" >> "$GITHUB_OUTPUT"
          echo "Staging URL: https://$HOST"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run staging smoke (desktop + mobile)
        env:
          BASE_URL: https://${{ steps.host.outputs.hostname }}
          CI: true
        run: npm run test:smoke

      - name: Lab FCP soft gate (OPS-P2-003)
        continue-on-error: true
        env:
          BASE_URL: https://${{ steps.host.outputs.hostname }}
          LAB_FCP_RUNS: "3"
        run: npm run test:lab-fcp

      - name: Run full staging journeys
        if: needs.changes.outputs.test_profile == 'full'
        env:
          BASE_URL: https://${{ steps.host.outputs.hostname }}
          CI: true
        run: npm run test:journey

      - name: Run content staging journeys
        if: needs.changes.outputs.test_profile == 'content'
        env:
          BASE_URL: https://${{ steps.host.outputs.hostname }}
          CI: true
        run: npm run test:journey:content

  terraform_prod:
    name: Terraform Apply Production
    needs: [changes, deploy_staging, smoke_staging]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.prod == 'true' &&
      needs.changes.outputs.release == 'true' &&
      needs.changes.outputs.infra == 'true' &&
      needs.deploy_staging.result == 'success' &&
      needs.smoke_staging.result == 'success'
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: infra/environments/prod
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Azure login (Terraform OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TF_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_TF_SUBSCRIPTION_ID }}

      - name: Require TF_GITHUB_TOKEN
        env:
          TF_GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: |
          if [ -z "$TF_GITHUB_TOKEN" ]; then
            echo "::error::Add repository secret TF_GITHUB_TOKEN (a PAT that can read/write Actions environment variables). The default GITHUB_TOKEN cannot manage environment variables."
            exit 1
          fi

      - name: Terraform init
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform init -input=false

      - name: Terraform plan
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform apply -input=false tfplan

  deploy_prod:
    name: Deploy Production
    needs: [changes, deploy_staging, smoke_staging, terraform_prod, build_release]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.outputs.prod == 'true' &&
      needs.deploy_staging.result == 'success' &&
      needs.smoke_staging.result == 'success' &&
      needs.build_release.result == 'success' &&
      (needs.terraform_prod.result == 'success' || needs.terraform_prod.result == 'skipped')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Static Web Apps deploy token
        id: swa
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_STATIC_WEB_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "api_key=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.api_key }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          api_location: "api"
          skip_app_build: true

      - name: Emit DeployCompleted to App Insights
        continue-on-error: true
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
          DEPLOY_ENVIRONMENT: prod
          GIT_SHA: ${{ github.sha }}
          JOB_NAME: Deploy Production
        run: |
          if [ -z "$APPINSIGHTS_CONNECTION_STRING" ]; then
            echo "No App Insights connection string; skipping."
            exit 0
          fi
          IKEY=$(echo "$APPINSIGHTS_CONNECTION_STRING" | sed -n 's/.*InstrumentationKey=\([^;]*\).*/\1/p')
          ENDPOINT=$(echo "$APPINSIGHTS_CONNECTION_STRING" | sed -n 's/.*IngestionEndpoint=\([^;]*\).*/\1/p')
          ENDPOINT=${ENDPOINT:-https://dc.services.visualstudio.com}
          ENDPOINT=${ENDPOINT%/}
          TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          curl -sS -X POST "${ENDPOINT}/v2/track" \
            -H "Content-Type: application/json" \
            -d "[{
              \"name\": \"Microsoft.ApplicationInsights.Event\",
              \"time\": \"${TIME}\",
              \"iKey\": \"${IKEY}\",
              \"data\": {
                \"baseType\": \"EventData\",
                \"baseData\": {
                  \"ver\": 2,
                  \"name\": \"DeployCompleted\",
                  \"properties\": {
                    \"environment\": \"${DEPLOY_ENVIRONMENT}\",
                    \"sha\": \"${GIT_SHA}\",
                    \"job\": \"${JOB_NAME}\"
                  }
                }
              }
            }]"

  # OPS-P3-003 — Sev1 path when Deploy Production fails. Emits DeployFailed → App Insights;
  # prod scheduled-query alert pages ag-elyse-critical-prod (email + SMS + voice).
  notify_prod_deploy_failure:
    name: Notify prod deploy failure
    needs: [deploy_prod]
    if: always() && !cancelled() && needs.deploy_prod.result == 'failure'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Emit DeployFailed to App Insights
        continue-on-error: true
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
          DEPLOY_ENVIRONMENT: prod
          GIT_SHA: ${{ github.sha }}
          JOB_NAME: Deploy Production
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$APPINSIGHTS_CONNECTION_STRING" ]; then
            echo "No App Insights connection string; cannot emit DeployFailed."
            exit 0
          fi
          IKEY=$(echo "$APPINSIGHTS_CONNECTION_STRING" | sed -n 's/.*InstrumentationKey=\([^;]*\).*/\1/p')
          ENDPOINT=$(echo "$APPINSIGHTS_CONNECTION_STRING" | sed -n 's/.*IngestionEndpoint=\([^;]*\).*/\1/p')
          ENDPOINT=${ENDPOINT:-https://dc.services.visualstudio.com}
          ENDPOINT=${ENDPOINT%/}
          TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          curl -sS -X POST "${ENDPOINT}/v2/track" \
            -H "Content-Type: application/json" \
            -d "[{
              \"name\": \"Microsoft.ApplicationInsights.Event\",
              \"time\": \"${TIME}\",
              \"iKey\": \"${IKEY}\",
              \"data\": {
                \"baseType\": \"EventData\",
                \"baseData\": {
                  \"ver\": 2,
                  \"name\": \"DeployFailed\",
                  \"properties\": {
                    \"environment\": \"${DEPLOY_ENVIRONMENT}\",
                    \"sha\": \"${GIT_SHA}\",
                    \"job\": \"${JOB_NAME}\",
                    \"runUrl\": \"${RUN_URL}\"
                  }
                }
              }
            }]"
          echo "Emitted DeployFailed (Sev1 SLI). Critical Action Group alert evaluates within ~5m."

  # TEST-D-003 — post-release prod smoke. Same Playwright suite as staging, against prod hostname.
  # Failures page Sev1 (SMS + voice via critical AG); no auto-rollback.
  smoke_prod:
    name: Smoke Production
    needs: [deploy_prod]
    if: always() && !cancelled() && needs.deploy_prod.result == 'success'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve production hostname
        id: host
        run: |
          HOST=$(az staticwebapp show \
            --name "${{ vars.AZURE_STATIC_WEB_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query defaultHostname -o tsv)
          if [ -z "$HOST" ]; then
            echo "::error::Could not resolve production Static Web App hostname"
            exit 1
          fi
          echo "hostname=$HOST" >> "$GITHUB_OUTPUT"
          echo "Production URL: https://$HOST"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke (desktop + mobile)
        env:
          BASE_URL: https://${{ steps.host.outputs.hostname }}
          CI: true
        run: npm run test:smoke

  notify_prod_smoke_failure:
    name: Notify prod smoke failure
    needs: [smoke_prod]
    if: always() && !cancelled() && needs.smoke_prod.result == 'failure'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Emit SmokeFailed to App Insights
        continue-on-error: true
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
          DEPLOY_ENVIRONMENT: prod
          GIT_SHA: ${{ github.sha }}
          JOB_NAME: Smoke Production
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$APPINSIGHTS_CONNECTION_STRING" ]; then
            echo "No App Insights connection string; cannot emit SmokeFailed."
            exit 0
          fi
          IKEY=$(echo "$APPINSIGHTS_CONNECTION_STRING" | sed -n 's/.*InstrumentationKey=\([^;]*\).*/\1/p')
          ENDPOINT=$(echo "$APPINSIGHTS_CONNECTION_STRING" | sed -n 's/.*IngestionEndpoint=\([^;]*\).*/\1/p')
          ENDPOINT=${ENDPOINT:-https://dc.services.visualstudio.com}
          ENDPOINT=${ENDPOINT%/}
          TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          curl -sS -X POST "${ENDPOINT}/v2/track" \
            -H "Content-Type: application/json" \
            -d "[{
              \"name\": \"Microsoft.ApplicationInsights.Event\",
              \"time\": \"${TIME}\",
              \"iKey\": \"${IKEY}\",
              \"data\": {
                \"baseType\": \"EventData\",
                \"baseData\": {
                  \"ver\": 2,
                  \"name\": \"SmokeFailed\",
                  \"properties\": {
                    \"environment\": \"${DEPLOY_ENVIRONMENT}\",
                    \"sha\": \"${GIT_SHA}\",
                    \"job\": \"${JOB_NAME}\",
                    \"runUrl\": \"${RUN_URL}\"
                  }
                }
              }
            }]"
          echo "Emitted SmokeFailed (Sev1 SLI). Critical Action Group alert evaluates within ~5m."
