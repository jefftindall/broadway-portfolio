name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan ${{ matrix.environment }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, prod]
    defaults:
      run:
        working-directory: infra/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure login (Terraform OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TF_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_TF_SUBSCRIPTION_ID }}

      - name: Require TF_GITHUB_TOKEN
        env:
          TF_GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: |
          if [ -z "$TF_GITHUB_TOKEN" ]; then
            echo "::error::Add repository secret TF_GITHUB_TOKEN (a PAT that can read/write Actions environment variables). The default GITHUB_TOKEN cannot manage environment variables."
            exit 1
          fi

      - name: Terraform init
        env:
          # Override Actions' GITHUB_TOKEN — the provider prefers it over GH_TOKEN.
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
          {
            echo "## Terraform plan (${{ matrix.environment }})"
            echo '```'
            head -c 60000 plan.txt
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.environment }}';
            let body = fs.readFileSync('infra/environments/' + env + '/plan.txt', 'utf8');
            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n\n…truncated…';
            }
            const marker = `<!-- tf-plan-${env} -->`;
            const comment = `${marker}\n### Terraform plan (\`${env}\`)\n\`\`\`\n${body}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
