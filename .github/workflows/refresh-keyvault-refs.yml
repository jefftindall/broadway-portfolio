name: Refresh Key Vault references

# Re-apply SWA Key Vault app-setting references so managed Functions pick up
# rotated Key Vault secret values without a site redeploy.
# Manual only — platform Key Vault reference cache is otherwise ~24h.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  refresh_staging:
    name: Refresh staging SWA secrets
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Re-apply Key Vault references
        run: |
          az account set --subscription e601e59a-c7f4-41f0-8178-b59740fb1974
          az staticwebapp appsettings set \
            --name swa-elyse-portfolio-staging \
            --resource-group rg-elyse-portfolio-staging \
            --setting-names \
              GEMINI_API_KEY="@Microsoft.KeyVault(SecretUri=https://kv-elyse-staging.vault.azure.net/secrets/GEMINI-API-KEY/)" \
              GITHUB_APP_ID="@Microsoft.KeyVault(SecretUri=https://kv-elyse-staging.vault.azure.net/secrets/GITHUB-APP-ID/)" \
              GITHUB_APP_INSTALLATION_ID="@Microsoft.KeyVault(SecretUri=https://kv-elyse-staging.vault.azure.net/secrets/GITHUB-APP-INSTALLATION-ID/)" \
              GITHUB_APP_PRIVATE_KEY="@Microsoft.KeyVault(SecretUri=https://kv-elyse-staging.vault.azure.net/secrets/GITHUB-APP-PRIVATE-KEY/)" \
              ALLOWED_USER_IDS="@Microsoft.KeyVault(SecretUri=https://kv-elyse-staging.vault.azure.net/secrets/ALLOWED-USER-IDS/)" \
              AAD_CLIENT_SECRET="@Microsoft.KeyVault(SecretUri=https://kv-elyse-staging.vault.azure.net/secrets/AAD-CLIENT-SECRET/)"

  refresh_prod:
    name: Refresh prod SWA secrets
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Re-apply Key Vault references
        run: |
          az account set --subscription e601e59a-c7f4-41f0-8178-b59740fb1974
          az staticwebapp appsettings set \
            --name swa-elyse-portfolio-prod \
            --resource-group rg-elyse-portfolio-prod \
            --setting-names \
              GEMINI_API_KEY="@Microsoft.KeyVault(SecretUri=https://kv-elyse-prod.vault.azure.net/secrets/GEMINI-API-KEY/)" \
              GITHUB_APP_ID="@Microsoft.KeyVault(SecretUri=https://kv-elyse-prod.vault.azure.net/secrets/GITHUB-APP-ID/)" \
              GITHUB_APP_INSTALLATION_ID="@Microsoft.KeyVault(SecretUri=https://kv-elyse-prod.vault.azure.net/secrets/GITHUB-APP-INSTALLATION-ID/)" \
              GITHUB_APP_PRIVATE_KEY="@Microsoft.KeyVault(SecretUri=https://kv-elyse-prod.vault.azure.net/secrets/GITHUB-APP-PRIVATE-KEY/)" \
              ALLOWED_USER_IDS="@Microsoft.KeyVault(SecretUri=https://kv-elyse-prod.vault.azure.net/secrets/ALLOWED-USER-IDS/)" \
              AAD_CLIENT_SECRET="@Microsoft.KeyVault(SecretUri=https://kv-elyse-prod.vault.azure.net/secrets/AAD-CLIENT-SECRET/)"
