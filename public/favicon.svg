<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="8" fill="#0e0d0c"/>
  <defs>
    <!-- Stage floor pool -->
    <radialGradient id="pool" cx="32" cy="46" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4a35a" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#c4a35a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c4a35a" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft descending beam -->
    <linearGradient id="beam" x1="32" y1="6" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4a35a" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#c4a35a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#c4a35a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamEdge" x1="32" y1="6" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4a35a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c4a35a" stop-opacity="0"/>
    </linearGradient>
    <!-- Lamp / source glow -->
    <radialGradient id="source" cx="32" cy="12" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3ebe0" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#c4a35a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#c4a35a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Floor wash -->
  <ellipse cx="32" cy="48" rx="22" ry="10" fill="url(#pool)"/>
  <!-- Beam (soft cone) -->
  <path fill="url(#beam)" d="M29 10h6l18 40H11L29 10z"/>
  <path fill="url(#beamEdge)" opacity="0.5" d="M30 10h4l14 38H16L30 10z"/>
  <!-- Light source -->
  <circle cx="32" cy="11" r="9" fill="url(#source)"/>
  <circle cx="32" cy="11" r="2.5" fill="#f3ebe0"/>
</svg>
